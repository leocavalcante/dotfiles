[font]
size = 12

[terminal.shell]
program = "/bin/zsh"
args = ["-lc", "tmux"]

# Imports replace keyboard.bindings, so repeat the shared Shift+Return mapping.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

# Preserve Option+Return for Pi's follow-up queue.
[[keyboard.bindings]]
key = "Return"
mods = "Alt"
chars = "\u001b[13;3u"

# Imports replace a whole array, so this block repeats the shared hint fields.
[[hints.enabled]]
command = "open"
hyperlinks = true
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "Shift"
