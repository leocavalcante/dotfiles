# Shared entry point. platform.toml is a machine-local symlink, not committed:
# macOS:   ln -sfn platforms/macos.toml ~/.dotfiles/.config/alacritty/platform.toml
# Windows: ln -sfn platforms/windows.toml ~/.dotfiles/.config/alacritty/platform.toml

[general]
import = [
  "~/.config/alacritty/common.toml",
  "~/.config/alacritty/platform.toml",
]
