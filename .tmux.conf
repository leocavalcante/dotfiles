# settings
# Workstations are the outer tmux and use C-Space: LCPC, macOS, and Termux
# (hostname localhost). The HomeLab server (hostname ubuntu) is the inner one,
# reached over Mosh, and uses C-b. The same prefix on both would swallow the
# inner key. Alacritty sends Ctrl-Space as CSI u so ConPTY does not drop it.
# Unbind both first so a reload cannot leave the previous prefix in place.
unbind-key C-b
unbind-key C-Space
if-shell '[ "$(hostname -s)" = ubuntu ]' {
  set -g prefix C-b
  bind-key C-b send-prefix
  set -g default-shell /usr/bin/zsh
  # The Termux keyboard shrinks the client. Hide the status bar below 20 rows.
  set-hook -g client-attached 'if -F "#{<:#{client_height},20}" "set status off" "set status on"'
  set-hook -g client-resized 'if -F "#{<:#{client_height},20}" "set status off" "set status on"'
} {
  set -g prefix C-Space
  bind-key C-Space send-prefix
}
# Keep clients connected when a session ends, even if others are attached.
set -g detach-on-destroy off
set -g mouse on
set -s escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:Tc"
set -ag terminal-overrides ",*:sitm=\e[3m:ritm=\e[23m"
# Preserve modified keys (including Shift+Enter) for terminal applications.
set -as terminal-features ',xterm-256color:extkeys'
set -s extended-keys on
set -s extended-keys-format csi-u
set -g xterm-keys on
# Follow whichever client was last typed in, so the phone and the desktop can
# stay attached at once.
set -g window-size latest
set -g status-position top
set -g status-interval 2

# Gruvbox Dark theme
# Status bar
set -g status-style "bg=terminal,fg=#a89984"
set -g status-left-length 32
set -g status-right-length 80
set -g status-left "#[fg=#665c54,bg=terminal] #S  #[default]"
# client_pid lets the script drop the clock when this client came from an outer tmux.
set -g status-right "#{prefix_highlight} #(~/.dotfiles/scripts/tmux-status '#{pane_current_path}' #{client_pid})"

# Window status
set -g window-status-format "#[fg=#a89984,bg=terminal,noreverse]  #W  "
set -g window-status-activity-style "fg=#a89984,bg=terminal,noreverse"
set -g window-status-current-format "#[fg=#83a598,bg=terminal,bold,noreverse]  #W  "
set -g window-status-separator ""

# Pane backgrounds
# Match the status bar, which uses the terminal background (#282828 in Alacritty).
# #1d2021 is Gruvbox bg0_h and reads as a darker gray inside the nested Lab pane.
# Both styles stay equal so an inactive pane is not dimmed.
set -g window-style "bg=terminal"
set -g window-active-style "bg=terminal"

# Use a teal divider to identify the active pane.
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"
set -g pane-border-status off

# Message style
set -g message-style "fg=#ebdbb2,bg=#3c3836"
set -g message-command-style "fg=#ebdbb2,bg=#3c3836"

# Mode style (copy mode highlighting)
set -g mode-style "fg=#1d2021,bg=#fabd2f"

# Clock
set -g clock-mode-colour "#83a598"

# Bell
set -g window-status-bell-style "fg=#fb4934,bg=default,bold"
setw -g monitor-activity on
set -g visual-activity off

# At window index at 1. It is most ergnomic for Prefix+N
set -g base-index 1
set -g pane-base-index 1

# bindings
# Drop the HomeLab root-table pane moves. vim-tmux-navigator owns C-h/j/k/l,
# and a reload would otherwise leave the old binds next to these.
unbind-key -n C-h
unbind-key -n C-j
unbind-key -n C-k
unbind-key -n C-l
unbind-key '\'
unbind-key C-h
unbind-key C-l
bind-key h split-window -v
bind-key l split-window -h
bind-key -r J switch-client -p
bind-key -r K switch-client -n
bind-key L switch-client -l
bind-key j previous-window
bind-key k next-window
# Keep Ctrl held after the prefix and repeat J/K to cycle windows.
set -g repeat-time 1000
bind-key -r C-j previous-window
bind-key -r C-k next-window
bind-key , command-prompt -I "" { rename-window "%%" }
bind-key R respawn-pane -k

# Rebalance panes without changing the current layout structure.
set-hook -g after-split-window 'select-layout -E'
set-hook -g after-kill-pane 'select-layout -E'
set-hook -g pane-exited 'select-layout -E'

# resize panes
bind-key -r M-j resize-pane -D 2
bind-key -r M-k resize-pane -U 2

# plugins
set -g @prefix_highlight_prefix_prompt 'PREFIX'
set -g @vim_navigator_prefix_mapping_clear_screen ""
set -g @plugin "tony-sol/tmux-kubectx"
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'

# continuum auto-restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-delete-backup-after '90'

# sessionx trigger
set -g @sessionx-bind 's'
set -g @sessionx-filter-current 'false'

run '~/.tmux/plugins/tpm/tpm'

# Plugin load order can replace send-prefix. Put the active prefix back.
if-shell '[ "$(hostname -s)" = ubuntu ]' \
  'bind-key C-b send-prefix' \
  'bind-key C-Space send-prefix'

# Modified keys across the outer tmux and the Lab tmux, which runs inside Mosh.
# The Mosh client does not request modified keys, so the outer tmux sends plain Enter for Shift+Return.
# In Mosh panes, send CSI-u Shift+Return; the Lab tmux re-encodes it for each pane.
bind-key -n S-Enter if-shell "ps -o comm= -t '#{pane_tty}' | grep -Eq '(^|/)mosh-client$'" \
  'send-keys -H 1b 5b 31 33 3b 32 75' 'send-keys S-Enter'
# Ctrl+J: send it to Pi, vim, fzf, and Mosh panes (the Lab tmux then decides for its own panes).
# Other panes still navigate down. This replaces the vim-tmux-navigator down binding.
bind-key -n C-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?(g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?|mosh-client)$' || ps -o args= -t '#{pane_tty}' | grep -Eq '(^|[ /])pi( |$)|pi-coding-agent'" \
  'send-keys C-j' 'select-pane -D'
